[project]
name = "trench-arcane-database"
version = "0.1.0"
description = "Versioned portable database assets and validation tooling for Trench Arcane"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
addopts = "-q"

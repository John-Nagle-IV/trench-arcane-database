name: validate-database-assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked validation dependencies
        run: uv sync --locked
      - name: Validate JSON schemas and portable reference data
        run: |
          uv run pytest
          uv run python scripts/validate_assets.py
